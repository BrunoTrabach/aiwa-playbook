<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
    <title>Avatares - AIWA Playbook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#f0f2f5] dark:bg-gray-950 min-h-screen flex justify-center py-4">

    <div class="w-full max-w-[420px] bg-gray-50 dark:bg-gray-900 min-h-[90vh] rounded-[32px] shadow-xl flex flex-col overflow-hidden pb-20">
        
        <header class="bg-[#E30613] p-6 text-white">
            <h1 class="text-2xl font-black tracking-tight">Equipe & Personas</h1>
            <p class="text-white/80 text-sm mt-1">Conheça os envolvidos no ecossistema.</p>
        </header>

        <main class="flex-1 p-4 space-y-4 overflow-y-auto no-scrollbar">
            
            <div class="grid grid-cols-2 gap-4">
                
                <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <img src="../assets/avatares/Bruno_Promotor_Aiwa.jpg" class="w-full h-32 object-cover rounded-xl mb-3">
                    <h3 class="font-bold text-gray-800 dark:text-gray-100">Bruno</h3>
                    <p class="text-[11px] text-red-600 font-bold uppercase tracking-wider">Promotor</p>
                </div>

                <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <img src="../assets/avatares/Edy_Vendedor.jpg" class="w-full h-32 object-cover rounded-xl mb-3">
                    <h3 class="font-bold text-gray-800 dark:text-gray-100">Edy</h3>
                    <p class="text-[11px] text-blue-600 font-bold uppercase tracking-wider">Vendedor</p>
                </div>

                <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <img src="../assets/avatares/Cristiane_cliente.jpg" class="w-full h-32 object-cover rounded-xl mb-3">
                    <h3 class="font-bold text-gray-800 dark:text-gray-100">Cristiane</h3>
                    <p class="text-[11px] text-green-600 font-bold uppercase tracking-wider">Cliente</p>
                </div>

                <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <img src="../assets/avatares/Fernanda_amiga.jpg" class="w-full h-32 object-cover rounded-xl mb-3">
                    <h3 class="font-bold text-gray-800 dark:text-gray-100">Fernanda</h3>
                    <p class="text-[11px] text-purple-600 font-bold uppercase tracking-wider">Amiga</p>
                </div>

            </div>
        </main>

        <nav class="absolute bottom-0 w-full bg-white dark:bg-gray-800 border-t p-4 flex justify-around">
            <a href="../index.html" class="text-xs font-bold text-gray-400">Voltar</a>
        </nav>
    </div>
</body>
</html>
