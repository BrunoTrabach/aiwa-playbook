<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparativos</title><link rel="stylesheet" href="../assets/css/gvbus.css"></head><body>
<div class="page-header"><h1>COMPARATIVOS</h1></div>
<div class="container"><div class="card">
<h3>Selecione os modelos</h3>
<label><input type="checkbox" class="m" value="aiwa" checked> Aiwa BBS-01</label> 
<label><input type="checkbox" class="m" value="jbl" checked> JBL Boombox 3</label>
<label><input type="checkbox" class="m" value="lg"> LG Xboom</label>
<label><input type="checkbox" class="m" value="philco"> Philco</label>
</div>
<div class="card"><table id="t"><thead><tr><th>Especificação</th><th data-k="aiwa">Aiwa BBS-01</th><th data-k="jbl">JBL Boombox 3</th><th data-k="lg" style="display:none">LG Xboom</th><th data-k="philco" style="display:none">Philco</th></tr></thead><tbody>
<tr><td>Potência</td><td data-k="aiwa">200W RMS</td><td data-k="jbl">180W (AC) / 136W (bateria)</td><td data-k="lg" style="display:none">—</td><td data-k="philco" style="display:none">—</td></tr>
<tr><td>Bateria</td><td data-k="aiwa">30h</td><td data-k="jbl">24h</td><td data-k="lg" style="display:none">—</td><td data-k="philco" style="display:none">—</td></tr>
<tr><td>IP</td><td data-k="aiwa">IP66</td><td data-k="jbl">IP67</td><td data-k="lg" style="display:none">—</td><td data-k="philco" style="display:none">—</td></tr>
<tr><td>Power Bank</td><td data-k="aiwa"><span class="badge" style="background:#009639">Sim 5V/2A</span></td><td data-k="jbl"><span class="badge" style="background:#009639">Sim</span></td><td data-k="lg" style="display:none">—</td><td data-k="philco" style="display:none">—</td></tr>
</tbody></table></div></div>
<script>document.querySelectorAll('.m').forEach(c=>c.onchange=()=>{document.querySelectorAll(`[data-k="${c.value}"]`).forEach(el=>el.style.display=c.checked?'':'none')})</script>
</body></html>
