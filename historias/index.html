<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórias</title><link rel="stylesheet" href="../assets/css/gvbus.css"></head><body><div class="page-header"><h1>HISTÓRIAS</h1></div><div class="container"><div class="card"><div class="nav"><button id="b1" onclick="load(1)">História 1</button><button id="b2" onclick="load(2)">História 2</button><button id="b3" onclick="load(3)">História 3</button><button id="b4" onclick="load(4)">História 4</button></div><div id="c"></div></div></div><script>function load(i){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('b'+i).classList.add('active');fetch(`dados/historia${i}.html`).then(r=>r.text()).then(h=>c.innerHTML=h)}load(1)</script></body></html>
