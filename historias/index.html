<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulações</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50"><header class="bg-[#E30613] text-white sticky top-0"><div class="flex items-center h-14 px-4 gap-3"><a href="../index.html" class="w-9 h-9 rounded-full bg-white/15 flex items-center justify-center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></a><h1 class="font-semibold">Simulações</h1></div></header><main class="p-4 max-w-3xl mx-auto"><div class="bg-white rounded-2xl p-5 shadow"><div class="flex gap-2 mb-4"><button onclick="load(1)" class="px-4 py-2 rounded-full bg-[#E30613] text-white text-sm">História 1</button><button onclick="load(2)" class="px-4 py-2 rounded-full bg-gray-200 text-sm">História 2</button><button onclick="load(3)" class="px-4 py-2 rounded-full bg-gray-200 text-sm">História 3</button><button onclick="load(4)" class="px-4 py-2 rounded-full bg-gray-200 text-sm">História 4</button></div><div id="c" class="min-h-[300px]"></div></div></main><script>function load(i){fetch(`dados/historia${i}.html`).then(r=>r.text()).then(h=>document.getElementById('c').innerHTML=h);document.querySelectorAll('button').forEach((b,idx)=>{b.className=idx+1===i?'px-4 py-2 rounded-full bg-[#E30613] text-white text-sm':'px-4 py-2 rounded-full bg-gray-200 text-sm'})}load(1)</script></body></html>
