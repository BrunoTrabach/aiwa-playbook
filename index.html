<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AIWA Playbook</title>
<meta name="theme-color" content="#E30613">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #eef1f4; -webkit-font-smoothing: antialiased; }
  .app { max-width: 420px; margin: 0 auto; min-height: 100vh; background: white; box-shadow: 0 20px 60px rgba(0,0,0,.08); display: flex; flex-direction: column; position: relative; }
  @media (min-width: 768px) { body { padding: 20px 0; } .app { border-radius: 32px; min-height: 90vh; overflow: hidden; } }
</style>
</head>
<body>
  <div class="app">
    <header class="bg-[#E30613] text-white pb-8 relative">
      <div class="pt-6 pb-3 text-center">
        <div class="text-[36px] font-extrabold tracking-tight leading-none lowercase">aiwa</div>
        <div class="text-[14px] font-light opacity-90 tracking-wide">Playbook</div>
      </div>
      <div class="px-5 pt-4">
        <h1 class="text-[26px] font-bold leading-tight">Olá, Bruno!</h1>
      </div>
    </header>

    <main class="flex-1 bg-[#f6f7f9] -mt-4 rounded-t-[28px] relative z-10 px-4 pb-28">
      <div class="pt-6">
        <!-- Dica -->
        <div class="bg-white rounded-[20px] p-4 flex gap-3 shadow-[0_8px_20px_rgba(0,0,0,.06)] border border-gray-100 mb-5">
          <div class="w-11 h-11 rounded-xl bg-[#E30613]/10 flex items-center justify-center flex-shrink-0">
            <span class="text-[22px]">💡</span>
          </div>
          <div class="flex-1">
            <h3 class="text-[#E30613] font-bold text-[15px]">Dica do dia</h3>
            <p class="text-[14px] text-gray-800 font-medium leading-snug mt-0.5">Use a demonstração <em>'sente o grave'</em> para fechar 3x mais</p>
          </div>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-2 gap-3.5">
          <a href="historias/" class="bg-white rounded-[18px] p-5 flex flex-col items-center gap-3 min-h-[132px] justify-center border-2 border-[#E30613] shadow-[0_4px_14px_rgba(0,0,0,.06)] active:scale-[.97] transition">
            <div class="w-14 h-14 rounded-2xl border-2 border-[#E30613] flex items-center justify-center text-[#E30613]">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 0 0 1-.9 3.8 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </div>
            <span class="text-[14px] font-semibold text-gray-900">Simulações</span>
          </a>

          <a href="conclusao/" class="bg-white rounded-[18px] p-5 flex flex-col items-center gap-3 min-h-[132px] justify-center border-2 border-[#0077B6] shadow-[0_4px_14px_rgba(0,0,0,.06)] active:scale-[.97] transition">
            <div class="w-14 h-14 rounded-2xl border-2 border-[#0077B6] flex items-center justify-center text-[#0077B6]">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <span class="text-[14px] font-semibold text-gray-900">Mensagem Final</span>
          </a>

          <a href="tecnologias/" class="bg-white rounded-[18px] p-5 flex flex-col items-center gap-3 min-h-[132px] justify-center border-2 border-[#009639] shadow-[0_4px_14px_rgba(0,0,0,.06)] active:scale-[.97] transition">
            <div class="w-14 h-14 rounded-2xl border-2 border-[#009639] flex items-center justify-center text-[#009639]">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
            </div>
            <span class="text-[14px] font-semibold text-gray-900">Tecnologias</span>
          </a>

          <a href="comparativos/" class="bg-white rounded-[18px] p-5 flex flex-col items-center gap-3 min-h-[132px] justify-center border-2 border-[#D90429] shadow-[0_4px_14px_rgba(0,0,0,.06)] active:scale-[.97] transition">
            <div class="w-14 h-14 rounded-2xl border-2 border-[#D90429] flex items-center justify-center text-[#D90429]">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
            </div>
            <span class="text-[14px] font-semibold text-gray-900">Comparativos</span>
          </a>

          <a href="treinamento/" class="bg-white rounded-[18px] p-5 flex flex-col items-center gap-3 min-h-[132px] justify-center border-2 border-[#6c757d] shadow-[0_4px_14px_rgba(0,0,0,.06)] active:scale-[.97] transition">
            <div class="w-14 h-14 rounded-2xl border-2 border-[#6c757d] flex items-center justify-center text-[#6c757d]">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
            <span class="text-[14px] font-semibold text-gray-900">Treinamento</span>
          </a>

          <a href="onde-comprar/" class="bg-white rounded-[18px] p-5 flex flex-col items-center gap-3 min-h-[132px] justify-center border-2 border-[#FF9500] shadow-[0_4px_14px_rgba(0,0,0,.06)] active:scale-[.97] transition">
            <div class="w-14 h-14 rounded-2xl border-2 border-[#FF9500] flex items-center justify-center text-[#FF9500]">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <span class="text-[14px] font-semibold text-gray-900">Onde Comprar</span>
          </a>
        </div>
      </div>
    </main>

    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[420px] bg-white/95 backdrop-blur border-t border-gray-200 flex justify-around py-2.5 pb-[calc(10px+env(safe-area-inset-bottom))] z-50">
      <a href="#" class="flex flex-col items-center gap-1 text-[#E30613] px-4 py-1">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="text-[11px] font-semibold">Início</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1 text-gray-400 px-4 py-1">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <span class="text-[11px]">Buscar</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1 text-gray-400 px-4 py-1">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 0 016.5 17H20"/><path d="M6.5 2H20v15H6.5A2.5 0 014 19.5v-15A2.5 0 016.5 2z"/></svg>
        <span class="text-[11px]">Playbook</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1 text-gray-400 px-4 py-1">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span class="text-[11px]">Perfil</span>
      </a>
    </nav>
  </div>
</body>
</html>
