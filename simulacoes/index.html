<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulações</title>
<link rel="stylesheet" href="../assets/css/unificado.css"></head><body>
<div class="header-page"><h1>SIMULAÇÕES</h1></div>
<div class="container">
  <div class="card">
    <div class="nav-pills">
      <button onclick="load(1)" id="b1" class="active">Simulação 1</button>
      <button onclick="load(2)" id="b2">Simulação 2</button>
      <button onclick="load(3)" id="b3">Simulação 3</button>
      <button onclick="load(4)" id="b4">Simulação 4</button>
      <a href="teatro.html" style="margin-left:auto;padding:9px 18px;background:#f39c12;color:#fff;border-radius:22px;text-decoration:none;font-weight:700">▶ Teatro</a>
    </div>
    <div id="content"></div>
  </div>
</div>
<div class="watermark-footer">Desenvolvido por Bruno Trabach • Playbook Aiwa V4 • 2026</div>
<script>
async function load(i){
  document.querySelectorAll('.nav-pills button').forEach(b=>b.classList.remove('active'));
  document.getElementById('b'+i).classList.add('active');
  const r=await fetch(`dados/historia${i}_integral.json`); const d=await r.json();
  let html=`<h2 style="color:var(--aiwa);margin-top:0">${d.titulo}</h2>`;
  const txt=d.texto_integral||'';
  const partes=txt.split('[ETAPA:');
  if(partes[0].trim()) html+=`<div class="texto-box">${partes[0].trim()}</div>`;
  for(let j=1;j<partes.length;j++){
    const [et,...rest]=partes[j].split(']'); html+=`<div class="etapa">ETAPA: ${et.trim()}</div>`;
    const corpo=rest.join(']').trim(); const linhas=corpo.split('\n'); let buf='';
    linhas.forEach(l=>{
      if(l.match(/^(PROMOTOR|CLIENTE|VENDEDOR|FERNANDA)/)){
        if(buf){html+=`<div class="texto-box">${buf}</div>`;buf='';}
        const [p,...f]=l.split(':'); const nome=p.trim(); const fala=f.join(':').trim();
        const av=nome.includes('PROMOTOR')?'../assets/avatares/Bruno_promotor_aiwa.png':nome.includes('CLIENTE')?'../assets/avatares/Cristiane_cliente.png':nome.includes('VENDEDOR')?'../assets/avatares/Edy_vendedor.png':'../assets/avatares/Fernanda Cliente.png';
        html+=`<div class="fala"><img src="${av}" onerror="this.style.display='none'"><div><b>${nome}:</b> ${fala}</div></div>`;
      } else if(l.trim()){ buf+=l+'\n'; }
    });
    if(buf) html+=`<div class="texto-box">${buf}</div>`;
  }
  document.getElementById('content').innerHTML=html;
}
load(1);
</script></body></html>
