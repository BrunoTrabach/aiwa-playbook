<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulação 4</title>
<style>body{margin:0;background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh} .chat{flex:1;overflow:auto;padding:20px} .msg{margin:10px 0;padding:12px 16px;border-radius:18px;max-width:80%;line-height:1.4} .bot{background:#1c1c1e;align-self:flex-start} .user{background:#E30613;align-self:flex-end;margin-left:auto} .cont{padding:16px;background:#111;text-align:center;display:none} button{background:#E30613;color:#fff;border:0;padding:14px 24px;border-radius:12px;font-weight:700;font-size:16px}</style>
</head><body><div class="chat" id="c"></div><div class="cont" id="b"><button onclick="location.href='../index.html'">Continuar história →</button></div>
<script>const m=[{"w": "bot", "t": "Fechamos?"}, {"w": "user", "t": "Quanto?"}, {"w": "bot", "t": "R$1.299. Leva 200W, 30h, app Aiwa Áudio BR, powerbank, USB, AUX com cabo, 6 modos RGB"}, {"w": "user", "t": "Vou levar a Aiwa"}, {"w": "bot", "t": "Boa! Vai sentir a diferença do Energy Saving"}];let i=0;function n(){if(i<m.length){const d=document.createElement('div');d.className='msg '+m[i].w;d.textContent=m[i].t;document.getElementById('c').appendChild(d);document.getElementById('c').scrollTop=1e9;i++;setTimeout(n,1400)}else{document.getElementById('b').style.display='block'}}n();</script></body></html>
