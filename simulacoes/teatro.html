<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teatro Aiwa</title>
<style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui}header{position:sticky;top:0;background:#111827;padding:10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #1f2937}
.btn{background:#1f2937;border:1px solid #374151;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
.progress{flex:1;height:6px;background:#1f2937;border-radius:3px}.bar{height:100%;width:0;background:#2563eb;transition:.3s}
.container{max-width:900px;margin:auto;padding:16px}.etapa{color:#93c5fd;margin:20px 0 8px;border-left:3px solid #2563eb;padding-left:8px;font-size:14px}
.chat{display:flex;gap:10px;margin:8px 0;opacity:0;transform:translateY(8px);transition:.4s}.chat.show{opacity:1;transform:none}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid #374151}.bubble{background:#1f2937;padding:10px;border-radius:12px;max-width:75%}
.bubble.me{background:#0b3a82}.name{font-size:12px;color:#9ca3af;margin-bottom:2px}
.final{text-align:center;padding:40px}</style></head>
<body>
<header><button class="btn" onclick="history.back()">←</button><div>História Completa</div><div class="progress"><div class="bar" id="bar"></div></div><button class="btn" id="p" onclick="toggle()">⏸️</button></header>
<div class="container" id="s"></div>
<script>
const f=[{e:"Sim 1 - Abordagem",n:"Bruno",a:"../avatares/bruno-promotor.jpg",t:"Opa, pode aumentar aí sem medo. Eu sou o Bruno, Promotor da AIWA.",m:1},
{n:"Cristiane",a:"../avatares/cristiane-cliente.jpg",t:"Tô olhando pra churrasco. Vi a C.1, mas ouvi falar bem da Aiwa."},
{n:"Bruno",a:"../avatares/bruno-promotor.jpg",t:"Podemos unir autonomia, qualidade e potência.",m:1},
{n:"Cristiane",a:"../avatares/cristiane-cliente.jpg",t:"Churrasco das 15h até depois da janta."},
{n:"Bruno",a:"../avatares/bruno-promotor.jpg",t:"Conhecia a AIWA 3 em 1?",m:1},
{n:"Cristiane",a:"../avatares/cristiane-cliente.jpg",t:"Meu pai tem um até hoje."},
{n:"Bruno",a:"../avatares/bruno-promotor.jpg",t:"Sente vibrar? São 200W RMS reais, mantém na bateria. IP66, 30h.",m:1},
{n:"Edy",a:"../avatares/edy-vendedor.jpg",t:"Vamos fechar? Leva hoje mesmo.",m:1},
{n:"Cristiane",a:"../avatares/cristiane-cliente.jpg",t:"Vamos."},
{e:"Sim 2 - Pós-venda",n:"Cristiane",a:"../avatares/cristiane-cliente.jpg",t:"Ei Edy, vim dar um oi."},
{n:"Edy",a:"../avatares/edy-vendedor.jpg",t:"Como foi o churrasco?",m:1},
{n:"Cristiane",a:"../avatares/cristiane-cliente.jpg",t:"Até meia-noite e ainda tinha bateria."},
{n:"Edy",a:"../avatares/edy-vendedor.jpg",t:"IP66, pode lavar com jato leve.",m:1},
{n:"Cristiane",a:"../avatares/cristiane-cliente.jpg",t:"E usar duas caixas?"}, 
{n:"Edy",a:"../avatares/edy-vendedor.jpg",t:"É o TWS, soma a potência.",m:1},
{e:"Sim 3 - Indicação",n:"Cristiane",a:"../avatares/cristiane-cliente.jpg",t:"Essa é a Fernanda."},
{n:"Bruno",a:"../avatares/bruno-promotor.jpg",t:"Pra academia ou praia?",m:1},
{n:"Fernanda",a:"../avatares/fernanda-cliente.jpg",t:"Academia e praia."},
{n:"Bruno",a:"../avatares/bruno-promotor.jpg",t:"Duas pareadas = 400W estéreo.",m:1},
{n:"Fernanda",a:"../avatares/fernanda-cliente.jpg",t:"Quero. Vou levar igual."},
{e:"Sim 4 - Treinamento",n:"Bruno",a:"../avatares/bruno-promotor.jpg",t:"Edy, coloca a mão, sente o grave. Não fale só 200W.",m:1},
{n:"Edy",a:"../avatares/edy-vendedor.jpg",t:"Sinto."},
{n:"Bruno",a:"../avatares/bruno-promotor.jpg",t:"Abre o app, liga Bass Boost, mostra equalizador.",m:1}];
let i=0,play=1,t;const s=document.getElementById('s'),b=document.getElementById('bar');
function show(){if(i>=f.length){s.innerHTML+='<div class="final"><h2>Fim</h2><p>Experiência vira relacionamento. Relacionamento vira venda.</p><a class="btn" href="../mensagem-final.html" style="background:#2563eb;text-decoration:none">Ver Mensagem Final</a></div>';play=0;return}
const x=f[i];if(x.e){s.innerHTML+=`<div class="etapa">${x.e}</div>`}
const d=document.createElement('div');d.className='chat';d.innerHTML=`<img class="avatar" src="${x.a}"><div><div class="name">${x.n}</div><div class="bubble ${x.m?'me':''}">${x.t}</div></div>`;s.appendChild(d);setTimeout(()=>d.classList.add('show'),30);b.style.width=((i+1)/f.length*100)+'%';window.scrollTo(0,document.body.scrollHeight);i++;if(play)t=setTimeout(show,3500)}
function toggle(){play=!play;document.getElementById('p').textContent=play?'⏸️':'▶️';if(play)show();else clearTimeout(t)}
show();
</script></body></html>
