<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comparativos - Aiwa Playbook</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");
    </script>
</head>
<body>

    <header class="topbar">
        <div class="logo-area">
            <a href="index.html" class="back-btn">❮</a>
            <h1>Comparativos Matriz</h1>
        </div>
        <div class="controls-area"><div class="status-indicator"></div></div>
    </header>

    <main class="app-container">
        <div class="content-wrapper">
            <div class="welcome-header">
                <span class="live-ticker">Análise de Concorrência</span>
                <h2>Confronto Técnico</h2>
            </div>

            <div class="cyber-panel neon-purple">
                <div class="panel-title">Escolha o Concorrente</div>
                <select id="brand-select">
                    <option value="jbl">JBL (Boombox 3)</option>
                    <option value="lg">LG (Xboom Go)</option>
                    <option value="philco">Philco (ExBass)</option>
                </select>

                <table class="compare-table">
                    <thead>
                        <tr>
                            <th>Recurso</th>
                            <th>AIWA Plus</th>
                            <th>Concorrente</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Amplificação</td>
                            <td style="color: var(--neon-cyan); font-weight:bold;">3 Canais Indep.</td>
                            <td>Canal Único Dinâmico</td>
                        </tr>
                        <tr>
                            <td>Vias de Som</td>
                            <td style="color: var(--neon-cyan); font-weight:bold;">Tri-axial Real</td>
                            <td>Full-range Coaxial</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <nav class="nav-menu">
        <a href="index.html" class="nav-btn"><div>🏠</div><span>Home</span></a>
        <a href="historias/index.html" class="nav-btn"><div>📖</div><span>Histórias</span></a>
        <a href="comparativos.html" class="nav-btn active"><div>📊</div><span>Comparar</span></a>
        <a href="sobre.html" class="nav-btn"><div>ℹ️</div><span>Sobre</span></a>
    </nav>

</body>
</html>
