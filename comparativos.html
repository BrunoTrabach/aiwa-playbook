<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comparativos Avançados - Aiwa Playbook</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");
    </script>
</head>
<body>

    <header class="topbar">
        <div class="logo-area">
            <a href="index.html" class="back-btn">❮</a>
            <h1>AIWA <span style="font-weight:300; opacity:0.85;">PLAYBOOK</span></h1>
        </div>
        <div class="controls-area"><div class="status-indicator"></div></div>
    </header>

    <main class="app-container">
        <div class="content-wrapper">
            
            <div class="welcome-header" style="margin-top: 8px;">
                <span class="live-ticker">Análise Concorrência 2025-2026</span>
                <h2>Confronto de Engenharia</h2>
            </div>

            <div class="cyber-panel card-purple" style="padding: 12px; display: flex; flex-direction: column; gap: 10px;">
                <span class="sender-tag" style="color: var(--neon-purple);">Selecione os Modelos para Comparação</span>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label style="font-size: 10px; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 4px; text-transform: uppercase;">Dispositivo 1</label>
                        <select id="select-model-1" class="fusion-select" onchange="renderComparison()"></select>
                    </div>
                    <div>
                        <label style="font-size: 10px; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 4px; text-transform: uppercase;">Dispositivo 2</label>
                        <select id="select-model-2" class="fusion-select" onchange="renderComparison()"></select>
                    </div>
                </div>
            </div>

            <div style="overflow-x: auto; width: 100%;">
                <table class="compare-table">
                    <thead>
                        <tr>
                            <th style="width: 34%; text-align: left; padding-left: 12px;">Especificação</th>
                            <th id="th-model-1" style="width: 33%; color: var(--text-primary);">Modelo 1</th>
                            <th id="th-model-2" style="width: 33%; color: var(--text-primary);">Modelo 2</th>
                        </tr>
                    </thead>
                    <tbody id="table-specs-body">
                        </tbody>
                </table>
            </div>

            <div id="arguments-wrapper" style="display: flex; flex-direction: column; gap: 12px;">
                </div>

        </div>
    </main>

    <nav class="nav-menu">
        <a href="index.html" class="nav-btn"><div>🏠</div><span>Home</span></a>
        <a href="historias/index.html" class="nav-btn"><div>📖</div><span>Histórias</span></a>
        <a href="comparativos.html" class="nav-btn active"><div>📊</div><span>Comparar</span></a>
        <a href="sobre.html" class="nav-btn"><div>ℹ️</div><span>Sobre</span></a>
    </nav>

    <script>
        // Base de Dados de Engenharia sem resumos (Dados Técnicos do comparativos.html + interface-comparativos.json)
        const database = {
            "BBS01-B": {
                nome: "Aiwa BBS01-B",
                marca: "Aiwa",
                potencia: "200W RMS",
                bateria: "Até 30 horas",
                protecao: "IP66 (Poeira e Jatos de água)",
                bluetooth: "5.3",
                peso: "4.1 kg",
                preco: "R$ 1.000 - R$ 1.600",
                diferenciais: "Mantém potência real na bateria; Integração App Aiwa Áudio BR com Bass Booster; Entrada USB para pen-drive; Powerbank.",
                argumentos: [
                    { titulo: "Custo-Benefício Imbatível", texto: "Entrega a mesma qualidade e pressão sonora que marcas premium custando cerca de R$ 1.000 a menos." },
                    { titulo: "Fidelidade Sem Quedas", texto: "Diferente dos concorrentes, a engenharia Aiwa não reduz os Watts RMS quando desplugada da tomada." }
                ],
                objecoes: [
                    { obj: "É resistente à água mesmo?", resp: "Possui certificação IP66. Aguenta perfeitamente jatos fortes e poeira, ideal para churrascos, praia e piscina. Só não pode submergir." }
                ]
            },
            "JBL Boombox 3": {
                nome: "JBL Boombox 3",
                marca: "JBL",
                potencia: "180W RMS (Tomada) / 136W RMS (Bateria)",
                bateria: "Até 24 horas",
                protecao: "IP67 (À prova de imersão sutil)",
                bluetooth: "5.3",
                peso: "6.7 kg",
                preco: "R$ 1.800 - R$ 2.500+",
                diferenciais: "Subwoofer integrado; Alça de metal rígida; Som encorpado porém muito pesada e cara.",
                argumentos: [
                    { titulo: "Preço Excessivamente Elevado", texto: "A JBL custa quase o dobro da Aiwa. Com o valor de uma JBL Boombox 3, o cliente compra DUAS caixas Aiwa e ativa o TWS, gerando 400W RMS de som estéreo real." },
                    { titulo: "Perda de Potência Fora da Tomada", texto: "Na tomada ela entrega 180W, mas na bateria cai drasticamente para 136W RMS para poupar energia. A Aiwa mantém 200W RMS estáveis a todo o tempo." }
                ],
                objecoes: [
                    { obj: "JBL é melhor porque tem IP67 e pode mergulhar", resp: "A pergunta real é: você vai escutar música debaixo d'água? O IP66 da Aiwa já protege totalmente contra chuva, ondas da praia e derramamento de bebidas. Pagar R$ 1.000 a mais só por isso não faz sentido prático." }
                ]
            },
            "PBX01": {
                nome: "Philco PBX01 Extreme",
                marca: "Philco",
                potencia: "300W Nominal (Cerca de 120W RMS Real)",
                bateria: "Até 10 horas",
                protecao: "IPX5 (Apenas respingos leves)",
                bluetooth: "5.4",
                peso: "3.2 kg",
                preco: "R$ 900 - R$ 1.400",
                diferenciais: "Bluetooth 5.4 econômico; Função ExBass; Preço inicial agressivo.",
                argumentos: [
                    { titulo: "Propaganda de Watts Ilusória", texto: "Os 300W anunciados pela Philco são potência nominal de pico, não RMS real. No teste prático de pressão acústica, a Aiwa com 200W RMS reais engole o volume da Philco facilmente." },
                    { titulo: "Bateria de Baixíssima Autonomia", texto: "A Philco entrega apenas 10 horas estimadas em volume baixo. No churrasco real, ela descarrega no meio do dia. A Aiwa garante até 30 horas de autonomia sustentada." },
                    { titulo: "Fragilidade contra Elementos", texto: "O IPX5 da Philco protege só contra gotas de chuva bem finas. Não aguenta poeira de obra/campo ou jatos de água que a Aiwa suporta com o IP66." }
                ],
                objecoes: [
                    { obj: "A Philco é mais barata e tem Bluetooth 5.4", resp: "O Bluetooth 5.4 é bom para economia, mas a bateria deles é pequena (só 10h). A Aiwa compensa com uma super bateria de 30h e entrega o dobro de fidelidade sonora de verdade." }
                ]
            },
            "LG XG9S": {
                nome: "LG XBOOM XG9S",
                marca: "LG",
                potencia: "80W + 40W RMS",
                bateria: "Até 24 horas",
                protecao: "IP67",
                bluetooth: "5.1",
                peso: "7.1 kg",
                preco: "R$ 1.500 - R$ 1.900",
                diferenciais: "Iluminação de palco pixelada traseira; Alça de ombro; Extremamente pesada.",
                argumentos: [
                    { titulo: "Ergonomia Comprometida (Peso)", texto: "Pesa mais de 7 kg. Torna-se desconfortável para carregar em trajetos de praia ou caminhadas. A Aiwa é equilibrada com 4.1 kg." },
                    { titulo: "Versão do Bluetooth Desatualizada", texto: "Utiliza a versão Bluetooth 5.1, antiga, que apresenta maior latência (atraso no áudio) e maior consumo de energia do telemóvel do que o sistema 5.3 da Aiwa." }
                ],
                objecoes: [
                    { obj: "A LG tem mais luzes e design moderno", resp: "Luz consome bateria que deveria ir para o som. O foco da Aiwa é engenharia de áudio pura, acústica limpa herdada da fábrica clássica da Sony. O som da Aiwa preenche melhor o ambiente aberto." }
                ]
            }
        };

        // Popula os seletores dinamicamente na inicialização
        function initSelects() {
            const s1 = document.getElementById("select-model-1");
            const s2 = document.getElementById("select-model-2");
            
            s1.innerHTML = "";
            s2.innerHTML = "";

            Object.keys(database).forEach(key => {
                let opt1 = document.createElement("option");
                opt1.value = key;
                opt1.textContent = database[key].nome;
                s1.appendChild(opt1);

                let opt2 = document.createElement("option");
                opt2.value = key;
                opt2.textContent = database[key].nome;
                s2.appendChild(opt2);
            });

            // Define Aiwa vs JBL como padrão inicial de comparação
            s1.value = "BBS01-B";
            s2.value = "JBL Boombox 3";
            renderComparison();
        }

        // Renderiza as especificações e os blocos de texto completos na tela
        function renderComparison() {
            const m1Key = document.getElementById("select-model-1").value;
            const m2Key = document.getElementById("select-model-2").value;

            const m1 = database[m1Key];
            const m2 = database[m2Key];

            // Atualiza os cabeçalhos da tabela
            document.getElementById("th-model-1").textContent = m1.nome;
            document.getElementById("th-model-2").textContent = m2.nome;

            // Injeta as linhas de dados técnicos
            const specs = [
                { label: "Potência RMS Real", d1: m1.potencia, d2: m2.potencia },
                { label: "Autonomia Bateria", d1: m1.bateria, d2: m2.bateria },
                { label: "Grau de Proteção", d1: m1.protecao, d2: m2.protecao },
                { label: "Versão Bluetooth", d1: m1.bluetooth, d2: m2.bluetooth },
                { label: "Peso Líquido", d1: m1.peso, d2: m2.peso },
                { label: "Faixa de Preço", d1: m1.preco, d2: m2.preco },
                { label: "Recursos Chave", d1: m1.diferenciais, d2: m2.diferenciais }
            ];

            let tableHTML = "";
            specs.forEach(spec => {
                tableHTML += `
                    <tr>
                        <td style="font-weight: 700; color: var(--text-secondary); padding-left: 12px;">${spec.label}</td>
                        <td style="font-weight: 600;">${spec.d1}</td>
                        <td style="font-weight: 600;">${spec.d2}</td>
                    </tr>
                `;
            });
            document.getElementById("table-specs-body").innerHTML = tableHTML;

            // Gera a seção estruturada de Contra-Ataques e Objeções sem perdas
            let argsHTML = "";

            // Seção de Argumentos do Modelo 1
            argsHTML += `
                <div class="cyber-panel neon-blue" style="display: flex; flex-direction: column; gap: 8px;">
                    <span class="sender-tag" style="color: var(--neon-blue);">Scripts de Ataque: ${m1.nome}</span>
            `;
            m1.argumentos.forEach(arg => {
                argsHTML += `
                    <p style="font-size: 13px; font-weight:700; margin-top:4px;">🔥 ${arg.titulo}</p>
                    <p style="font-size: 12px; color: var(--text-secondary); line-height:1.4;">${arg.texto}</p>
                `;
            });
            argsHTML += `</div>`;

            // Seção de Argumentos do Modelo 2
            if(m1Key !== m2Key) {
                argsHTML += `
                    <div class="cyber-panel neon-orange" style="display: flex; flex-direction: column; gap: 8px;">
                        <span class="sender-tag" style="color: var(--neon-orange);">Scripts de Ataque: ${m2.nome}</span>
                `;
                m2.argumentos.forEach(arg => {
                    argsHTML += `
                        <p style="font-size: 13px; font-weight:700; margin-top:4px;">🔥 ${arg.titulo}</p>
                        <p style="font-size: 12px; color: var(--text-secondary); line-height:1.4;">${arg.texto}</p>
                    `;
                });
                argsHTML += `</div>`;
            }

            // Seção de Quebra de Objeções Direta em Loja
            argsHTML += `
                <div class="cyber-panel neon-red" style="display: flex; flex-direction: column; gap: 8px;">
                    <span class="sender-tag" style="color: var(--neon-red);">Contorno de Objeções Direto em Loja</span>
            `;
            m1.objecoes.forEach(o => {
                argsHTML += `
                    <div style="background: rgba(0,0,0,0.15); padding: 8px; border-radius: 6px; margin-top: 4px;">
                        <p style="font-size: 12px; font-weight:700; color: var(--neon-red);">❌ Objeção: "${o.obj}"</p>
                        <p style="font-size: 12px; color: var(--text-primary); margin-top: 2px; line-height:1.4;">💬 <b>Resposta Recomendada:</b> ${o.resp}</p>
                    </div>
                `;
            });
            if(m1Key !== m2Key) {
                m2.objecoes.forEach(o => {
                    argsHTML += `
                        <div style="background: rgba(0,0,0,0.15); padding: 8px; border-radius: 6px; margin-top: 4px;">
                            <p style="font-size: 12px; font-weight:700; color: var(--neon-red);">❌ Objeção: "${o.obj}"</p>
                            <p style="font-size: 12px; color: var(--text-primary); margin-top: 2px; line-height:1.4;">💬 <b>Resposta Recomendada:</b> ${o.resp}</p>
                        </div>
                    `;
                });
            }
            argsHTML += `</div>`;

            document.getElementById("arguments-wrapper").innerHTML = argsHTML;
        }

        document.addEventListener("DOMContentLoaded", initSelects);
    </script>
</body>
</html>
